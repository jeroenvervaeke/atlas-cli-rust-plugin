version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # release.yml is autogenerated by dist, so bump the action versions
    # by upgrading cargo-dist instead of letting Dependabot edit the file.
    exclude-paths:
      - ".github/workflows/release.yml"
