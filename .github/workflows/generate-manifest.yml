name: Generate manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  generate_manifest:
    runs-on: "ubuntu-20.04"
    steps:
    - uses: actions/checkout@v4
    - name: Print plan
      env:
        PLAN: ${{ inputs.plan }}
      run: |
        export VERSION="$(echo "$PLAN" | jq -r '.releases[0].app_version')"
        export GITHUB_REPOSITORY_OWNER="$(echo "$PLAN" | jq -r '.releases[0].hosting.github.owner')"
        export GITHUB_REPOSITORY_NAME="$(echo "$PLAN" | jq -r '.releases[0].hosting.github.repo')"
        echo "VERSION=$VERSION"
        cat manifest.template.yml | envsubst > manifest.yml
        echo "manifest:"
        cat manifest.yml
    - name: "Upload artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-manifest
        path: |
          manifest.yml