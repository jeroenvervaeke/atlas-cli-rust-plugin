name: Generate manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  generate-manifest:
    runs-on: "ubuntu-latest"
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Print plan
        run: |
          export APP_VERSION="$(echo "$PLAN" | jq -r '.releases[0].app_version')"
          echo "APP_VERSION=$APP_VERSION"
          envsubst < manifest.template.yml > manifest.yml
          echo "manifest:"
          cat manifest.yml